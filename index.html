<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cisama | Admin Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Arial,sans-serif;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  background:#071426;
}

/* Imagen de fondo */
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:url('templates/assets/fondo-admin.jpg') center/cover no-repeat;
  z-index:0;
  filter:brightness(.55) saturate(1.1);
}
/* Capa oscura encima */
body:after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, #1455a555 0%, transparent 55%),
    radial-gradient(circle at 80% 80%, #0a7cff44 0%, transparent 55%),
    linear-gradient(180deg, #071426aa 0%, #071426dd 100%);
  z-index:1;
}

/* Card */
.login-card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:420px;
  background:linear-gradient(160deg,#0d2038e6,#0a192ce6);
  border:1px solid #1c3552;
  border-radius:20px;
  padding:34px 34px 30px;
  box-shadow:0 25px 60px #0009, inset 0 1px 0 #ffffff0a;
  backdrop-filter:blur(18px) saturate(1.2);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);
  animation:cardIn .6s cubic-bezier(.22,1,.36,1) both;
  margin:auto 0;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* Logo */
.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
}
.brand-logo{
  height:90px;
  width:auto;
  max-width:240px;
  object-fit:contain;
  filter:drop-shadow(0 8px 20px #2476d966);
}

/* Título */
.login-header{
  text-align:center;
  margin-bottom:24px;
}
.login-header h1{
  font-size:24px;
  font-weight:800;
  letter-spacing:-.5px;
  margin-bottom:6px;
}
.login-header h1 span{color:#438eea}
.login-header p{
  color:#8fa3bd;
  font-size:12.5px;
  line-height:1.5;
}

/* Form */
.field{
  margin-bottom:16px;
  position:relative;
}
.field label{
  display:block;
  font-size:11.5px;
  color:#aebbd0;
  font-weight:600;
  margin-bottom:7px;
  letter-spacing:.3px;
  text-transform:uppercase;
}
.input-wrap{
  position:relative;
}
.input-wrap > i{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#7f93ad;
  font-size:14px;
  pointer-events:none;
  transition:color .25s;
}
.input-wrap input{
  width:100%;
  height:48px;
  background:#071426cc;
  border:1px solid #1f3a5a;
  border-radius:11px;
  color:white;
  padding:0 46px 0 44px;
  outline:none;
  font-size:14px;
  transition:.25s;
}
.input-wrap input::placeholder{color:#5e7593}
.input-wrap input:focus{
  border-color:#438eea;
  background:#0b1b30;
  box-shadow:0 0 0 4px #438eea22;
}
.input-wrap input:focus ~ i,
.input-wrap:focus-within > i{color:#438eea}

/* Toggle password */
.toggle-pass{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  background:transparent;
  border:0;
  color:#7f93ad;
  font-size:14px;
  cursor:pointer;
  width:34px;height:34px;
  border-radius:8px;
  transition:.25s;
}
.toggle-pass:hover{color:#438eea;background:#438eea15}

/* Row remember/forgot */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:4px 0 20px;
  font-size:12.5px;
  gap:8px;
  flex-wrap:wrap;
}
.remember{
  display:flex;
  align-items:center;
  gap:8px;
  color:#aebbd0;
  cursor:pointer;
  user-select:none;
}
.remember input{
  appearance:none;
  -webkit-appearance:none;
  width:16px;height:16px;
  border:1.5px solid #2a4a6e;
  border-radius:5px;
  background:#071426;
  cursor:pointer;
  position:relative;
  transition:.2s;
  flex-shrink:0;
}
.remember input:checked{
  background:#2476d9;
  border-color:#2476d9;
}
.remember input:checked:after{
  content:"\f00c";
  font-family:"Font Awesome 6 Free";
  font-weight:900;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:9px;
  color:white;
}
.forgot{
  color:#438eea;
  text-decoration:none;
  font-weight:600;
  transition:.2s;
  white-space:nowrap;
}
.forgot:hover{color:#70b4ff}

/* Botón */
.btn-login{
  width:100%;
  height:50px;
  border:0;
  border-radius:11px;
  background:linear-gradient(135deg,#2476d9,#1455a5);
  color:white;
  font-weight:700;
  font-size:14px;
  letter-spacing:.5px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:.3s;
  box-shadow:0 10px 24px #2476d94d, inset 0 1px 0 #ffffff33;
  position:relative;
  overflow:hidden;
}
.btn-login:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,#4397ff,#2476d9);
  opacity:0;
  transition:.3s;
}
.btn-login > *{position:relative;z-index:1}
.btn-login:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 30px #2476d966, inset 0 1px 0 #ffffff33;
}
.btn-login:hover:before{opacity:1}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* Mensaje */
.msg{
  display:none;
  margin-top:14px;
  padding:11px 13px;
  border-radius:10px;
  font-size:12.5px;
  align-items:center;
  gap:9px;
}
.msg.show{display:flex}
.msg.error{
  background:#ff4d4d18;
  border:1px solid #ff4d4d55;
  color:#ff9a9a;
}
.msg.success{
  background:#65cf9a18;
  border:1px solid #65cf9a55;
  color:#8be4b5;
}

/* Footer */
.login-footer{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid #ffffff0d;
  text-align:center;
  font-size:11.5px;
  color:#6f849e;
}
.login-footer i{color:#438eea;margin-right:5px}

/* Responsive */
@media(max-width:430px){
  body{padding:14px}
  .login-card{padding:28px 22px 24px;border-radius:16px}
  .login-header h1{font-size:21px}
  .login-header p{font-size:12px}
  .brand-logo{height:75px;max-width:200px}
  .input-wrap input{height:46px;font-size:13.5px}
  .btn-login{height:48px;font-size:13px}
  .row{font-size:11.5px}
}

/* Pantallas bajas */
@media(max-height:680px){
  .login-card{padding:24px 28px 22px}
  .brand-logo{height:70px;max-width:200px}
  .brand{margin-bottom:10px}
  .login-header{margin-bottom:18px}
  .login-header h1{font-size:22px}
  .field{margin-bottom:14px}
  .row{margin:4px 0 16px}
  .btn-login{height:46px}
  .login-footer{margin-top:16px;padding-top:14px}
}
</style>
</head>

<body>

<div class="login-card">

  <div class="brand">
    <img src="templates/assets/logo.png" alt="Cisama Logo" class="brand-logo">
  </div>

  <div class="login-header">
    <h1>Cisama <span>Admin</span></h1>
    <p>Inicia sesión para administrar la tienda</p>
  </div>

  <form id="loginForm" autocomplete="off">

    <div class="field">
      <label for="usuario">Usuario</label>
      <div class="input-wrap">
        <input type="text" id="usuario" name="usuario" placeholder="Tu usuario de admin" required>
        <i class="fa-solid fa-user"></i>
      </div>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        <i class="fa-solid fa-lock"></i>
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>
    </div>

    <div class="row">
      <label class="remember">
        <input type="checkbox" id="remember">
        Recordarme
      </label>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">
      <span>INICIAR SESIÓN</span>
      <i class="fa-solid fa-arrow-right-to-bracket"></i>
    </button>

    <div class="msg" id="msg"></div>

  </form>


</div>

<script>

// ============================
// CONFIGURACIÓN API
// ============================
const API_LOGIN = "https://api-chicken-runner.monitorealo.online/api/loguearse";
const REDIRECT_URL = "admin.html"; // cambia si tu panel está en otra ruta

// ============================
// ELEMENTOS
// ============================
const togglePass = document.getElementById('togglePass');
const passInput = document.getElementById('password');
const form = document.getElementById('loginForm');
const btn = document.getElementById('btnLogin');
const msg = document.getElementById('msg');

// ============================
// MOSTRAR / OCULTAR CONTRASEÑA
// ============================
togglePass.addEventListener('click', () => {
  const isPass = passInput.type === 'password';
  passInput.type = isPass ? 'text' : 'password';
  togglePass.innerHTML = isPass
    ? '<i class="fa-solid fa-eye-slash"></i>'
    : '<i class="fa-solid fa-eye"></i>';
  togglePass.setAttribute('aria-label', isPass ? 'Ocultar contraseña' : 'Mostrar contraseña');
});

// ============================
// MENSAJES
// ============================
function mostrarMsg(texto, tipo){
  msg.className = 'msg show ' + tipo;
  msg.innerHTML = `<i class="fa-solid ${tipo==='error'?'fa-circle-exclamation':'fa-circle-check'}"></i><span>${texto}</span>`;
}
function ocultarMsg(){
  msg.className = 'msg';
  msg.innerHTML = '';
}

// ============================
// SUBMIT LOGIN
// ============================
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  ocultarMsg();

  const usuario = document.getElementById('usuario').value.trim();
  const password = passInput.value;

  if(!usuario || !password){
    mostrarMsg('Completa todos los campos', 'error');
    return;
  }

  // Estado de carga
  btn.disabled = true;
  const contenidoOriginal = btn.innerHTML;
  btn.innerHTML = '<span>VERIFICANDO...</span><i class="fa-solid fa-spinner fa-spin"></i>';

  try {
    const res = await fetch(API_LOGIN, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      // ⚠️ Tu backend espera "user" y "password"
      body: JSON.stringify({
        user: usuario,
        password: password
      })
    });

    // Intentamos parsear aunque el status no sea 200
    let data;
    try {
      data = await res.json();
    } catch {
      throw new Error('Respuesta inválida del servidor');
    }

    // Si el servidor devuelve status:false → error
    if (!res.ok || !data.status) {
      throw new Error(data.mensaje || 'Usuario o contraseña incorrectos');
    }

    // ✅ Login exitoso
    const token = data?.Datos?.token;
    const name = data?.Datos?.name;

    if(!token){
      throw new Error('El servidor no devolvió token');
    }

    // Guardar token según "Recordarme"
    const remember = document.getElementById('remember').checked;
    if(remember){
      localStorage.setItem('adminToken', token);
      localStorage.setItem('adminName', name || usuario);
    }else{
      sessionStorage.setItem('adminToken', token);
      sessionStorage.setItem('adminName', name || usuario);
    }

    mostrarMsg(data.mensaje || '¡Bienvenido! Redirigiendo...', 'success');

    // Redirigir después de un pequeño delay
    setTimeout(() => {
      window.location.href = REDIRECT_URL;
    }, 900);

  } catch (err) {
    console.error('Error login:', err);
    mostrarMsg(err.message || 'Error al iniciar sesión', 'error');
    btn.disabled = false;
    btn.innerHTML = contenidoOriginal;
  }
});

</script>

</body>
</html>
